# ps5-jb-server configuration. Install to /etc/ps5-jb-server/config.toml.
# Every value can also be overridden with PS5JB_* environment variables.

[network]
# Address of this host on the home LAN. Leave empty to detect from the default route.
host_ip = ""
# LAN that may use this service. Leave empty to derive <host_ip>/24.
subnet = ""
# Upstream resolver for allowed names. Leave empty to read /etc/resolv.conf.
upstream_dns = ""
# LAN interface for the gateway rules. Leave empty to use the interface holding
# host_ip (then the default route's). One interface only: PS5 traffic must
# enter and leave through it.
interface = ""

[ports]
dns = 53
http = 80
https = 443
admin = 8443
repo = 8080

[ps5]
pldmgr_port = 8084     # Payload Manager web UI on the console
elf_port = 9021        # elfldr on the console
file_port = 80         # HTTP file service (tom-ps5-usbnet payload, on its USB adapter address)
ftp_port = 2120        # FTP fallback (zftpd); 0 disables the fallback
space_port = 8888      # free/total for the FTP mode, read from web-file-mgr; 0 disables
pkg_port = 8090        # PKG install: serves the NAS file to the console while a job runs; 0 disables
game_dirs = ["games", "homebrew", "etaHEN/games"]  # game library: folders under each volume listed one level deep
engine_url = "http://127.0.0.1:19113"  # PS5Upload engine for wake / standby (optional)
control = true         # enable the PS5 host page
file_manager = true    # enable the PS5 file page

[limits]
max_upload = 67108864  # 64 MiB, plugin repository uploads (held in memory)
max_file_upload = 0     # PS5 file manager uploads are streamed; 0 = no limit
transfer_retries = 3    # NAS -> PS5: retries per file on network errors (resumes when the FTP fallback supports REST); 0 = off

[activity]
retention_days = 30    # network activity history kept in <data>/activity.db (1-365)

[repo]
# Upstream index for "check for plugin updates" (Payload Manager's official source).
upstream = "https://itsplk.github.io/ps5-payloads-mirror/payloads_v2.json"

[paths]
data = "/var/lib/ps5-jb-server"
repo = "/srv/ps5-jb-server"
static = "/opt/ps5-jb-server/web"
certs = "/etc/ps5-jb-server/tls"
credentials = "/var/lib/ps5-jb-server/credentials.json"
rulesets = "/opt/ps5-jb-server/rulesets/compiled.json"
