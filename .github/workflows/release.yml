name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install dnspython cryptography
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests
          node --test tests/ui-interactions.js
      - name: Validate release tag and package runtime
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/build_release.py --tag "$RELEASE_TAG"
          else
            python scripts/build_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag --notes-file "$notes" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
