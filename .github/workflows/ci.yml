name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Debian 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install dnspython cryptography ruff
      - name: Lint (pyflakes level)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 server installer scripts tests
      - name: Compile
        run: |
          python -m compileall -q server installer scripts
          for file in web/*.js; do node --check "$file"; done
      - name: Regression tests
        run: |
          python -m unittest discover -s tests
          node --test tests/ui-interactions.js
      - name: Privacy scan
        run: ./scripts/check-secrets.sh
      - name: Package
        run: python scripts/build_release.py --output /tmp/dist
